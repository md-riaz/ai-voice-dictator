name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec
        id: version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*([^\s#]+)' } | Select-Object -First 1
          if (-not $line -or $line -notmatch '^version:\s*(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)(?:\+\d+)?\s*(?:#.*)?$') {
            throw 'pubspec.yaml must specify a valid version.'
          }
          $version = $Matches[1]
          if (git ls-remote --exit-code --tags origin "refs/tags/v$version") {
            throw "Tag v$version already exists. Update pubspec.yaml before releasing."
          }
          if ($LASTEXITCODE -ne 2) { throw 'Could not check remote tags.' }
          $global:LASTEXITCODE = 0
          "value=$version" >> $env:GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Build Windows app
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $source = Join-Path $PWD 'build\windows\x64\runner\Release'
          if (-not (Test-Path (Join-Path $source 'AI-Voice-Dictator.exe'))) { throw 'Windows executable is missing.' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$source" "/O$PWD\dist" '.github\windows-installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $assets = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          if ($assets.Count -ne 1 -or $assets[0] -notlike '*-Setup.exe') { throw 'Expected the Windows setup executable.' }
          gh release create "v$env:APP_VERSION" @assets --target $env:GITHUB_SHA --title "AI Voice Dictator v$env:APP_VERSION" --notes 'Download and run the Windows x64 Setup.exe installer.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
